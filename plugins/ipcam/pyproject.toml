# The environment the plugin runs the server in. uv.lock pins every package with hashes;
# .mcp.json starts the server with `uv run --frozen`, so users get exactly these files.
# Update after a release: set the version below, then run `uv lock --project plugins/ipcam`.
[project]
name = "ipcam-plugin"
version = "0.5.1"
description = "Locked environment for the ipcam Claude Code plugin"
requires-python = ">=3.13"
dependencies = ["ipcam-mcp==0.5.1"]

[tool.uv]
package = false
# Linux (and WSL2) and Apple Silicon Macs only; skipping other platforms keeps the lock under
# the plugin directory's 256 KiB file limit. Intel Macs are left out: cryptography (via mcp)
# ships no wheels for them, so installing would need a Rust toolchain.
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

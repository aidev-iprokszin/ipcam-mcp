# The environment the plugin runs the server in. uv.lock pins every package with hashes;
# .mcp.json starts the server with `uv run --frozen`, so users get exactly these files.
# Update after a release: set the version below, then run `uv lock --project plugins/ipcam`.
[project]
name = "ipcam-plugin"
version = "0.4.0"
description = "Locked environment for the ipcam Claude Code plugin"
requires-python = ">=3.13"
dependencies = ["ipcam-mcp==0.4.0"]

[tool.uv]
package = false
# The server supports Linux (and WSL2) only; skipping other platforms keeps the lock small.
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]
